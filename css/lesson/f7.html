<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
           width: 0;
           padding: 0;
           box-sizing: border-box;
         
        }
        .control{
            width: 100%;
            height: 100%;
            margin: auto;
        }
        .border{
            margin-top: 50px;
            width: 400px;
            height: 500px;
            box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
            border: 2px solid black;
            padding: 25px 30px;
        }
        .img1{
            width: 400px;
            height: 500px;
            background-color: black;
        }
        span{
            margin-top: 10px;
            font-size: 20px;
        }
        label{
            font-size: 25px;
        }
        button{
            width: 150px;
            height: 30px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="control">
        <div class="border">
            <div class="img1">
                <img
                src="https://i.pinimg.com/1200x/2a/4e/c7/2a4ec703023317ccac851a182c082a61.jpg" alt="">
            </div>
            <span>Shoes for running</span><br>
            <label for="">150$</label><br>
            <button>Buy</button>
        </div>
    </div>
    
</body>
</html>
