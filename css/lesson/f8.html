<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .control{
            border: 1px solid black;
            width: 400px;
            height: 550px;
            margin: auto;
            margin-top: 10px;
        }
        .all{
            border: 1px solid rgb(125, 123, 123);
            width: 90%;
            height: 70%;
            border-radius: 10px;
            margin: auto;
            margin-top:20px ;
            background-color: rgb(223, 218, 218);
            box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        }
        .card{
            width: 90%;
            height:90%;
            margin: auto;
            background-color: blueviolet;
            border-radius: 10px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 6px 12px -2px, rgba(0, 0, 0, 0.3) 0px 3px 7px -3px;
            margin-top: 15px;
        }
        .card img{
            margin-bottom: 20px;
            margin-top: 100px;
            margin: auto;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }    
        .text{

        
            font-size: 25px;
            margin-left: 10px;
            margin-top: 30px;
            

        }
        #price{
            font-size: 20px;
            margin-left: 10px;
            margin-top: 5px;
            color: blueviolet;
        }
        button{
            width: 80px;
            height: 30px;
            margin-top: 10px;
            margin-left: 10px;
            background-color:blue;
            color: white
        }
    </style>
</head>
<body>
    <div class="control">
        <div class="all">
            <div class="card">
                <img src="https://i.pinimg.com/1200x/22/3d/2e/223d2e0183b2e4ff79e87547ddfe428d.jpg" alt="">
            </div>
            <p class="text">X-Running</p>
            <p id="price">169$</p>
            <button>Buy Now</button>
        </div>
    </div>
</body>
</html>
