<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .background{
            width: 500px;
            height: 550px;
            margin: auto;
            margin-top: 30px;
            background-color: black;
            background-image: url("https://i.pinimg.com/1200x/8f/3d/db/8f3ddbbd722441fadc05f3b3a4074f0a.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            padding: 40px;
        }
        .form{
            width: 300px;
            height: 400px;
            margin: auto;
            backdrop-filter: blur(5px);
            border-radius: 10px;
           box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;
        }
        .form1{
            margin-left: 15px;
            color: white;
            
        }
        .form h1{
            text-align: center;
            color: white;
        }
        .form1 input{
            width: 100%;
            height: 25px;
            background-color: transparent;
            border-color: white;
            border-radius: 5px;

        }
        ::placeholder{
            color: rgb(254, 254, 254);
        }
       

    </style>        
<body>
    <div class="background">
        <div class="form">
           <h1>Login</h1>
        <div class="form1">   
            <div class="text">
                <p>Username</p>
                <input type="text" placeholder="name123">
            </div><br>
            <div class="text1">
                <p>Email</p>
                <input type="email" placeholder="ashd12@gamil.com">
            </div>
        </div>
        </div>
    </div>
</body>
</html>
