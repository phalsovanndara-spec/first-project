<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=density_small" />
    <style>
        .menu{
            display: flex;
            gap: 20px;
        }
        .follow{
           padding: 20px;
           width: 10px;
           transition: 0.2s;
        }
        .follow:hover{
            transform:scale(1.1);
        }
        h1{
            opacity: 0;
        }
        .menu:hover .text{
            opacity: 1;
            transition: 1s;
        }
        
        .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 300,
        'GRAD' 0,
        'opsz' 24;
        margin-top: 10px;
        }

    </style>
</head>
<body>
    <div class="control">
        <div class="menu">
            <div class="follow">
                <span class="material-symbols-outlined">
                density_small
                </span>
            </div>
            <h1 class="text">hello world</h1>
        </div>
    </div>
</body>
</html>
