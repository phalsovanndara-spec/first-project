<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: blue;
            transition: all 0.3s ease-in-out;
        }
        .box:hover{
            background-color: rgb(252, 144, 4);
        }
        .box.text{
            color: blueviolet;
            display: block;
        }
        
    </style>
</head>
<body>
    <div class="box">
        <p>This is box</p>
        <img src="https://i.pinimg.com/736x/7b/d8/82/7bd882be1eace4acbbb5ed7486f98d35.jpg" alt="">
    </div>
</body>
</html>
