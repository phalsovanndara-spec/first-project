<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            background-color: rgb(0, 251, 255);
            position: relative;
            margin: auto;
        }
        .test1{
            width: 50px;
            height: 50px;
            background-color: brown;
            position: absolute;
            animation: test 5s ease-in-out infinite ;
        }
    @keyframes test {
        0%{
            top: 0;
            left: 0;
            background-color: brown;
        }
        25%{
            top:0;
            left: calc(100% - 50px);
            background-color: rgb(0, 8, 15);
        }
        50%{
            top: calc(100% - 50px);
            left: calc(100% - 50px);
            background-color: rgb(0, 21, 255);
        }
        75%{
            top: calc(100% - 50px);
            left: 0;
            background-color: rgb(248, 137, 1);
        }
        100%{
            top: 0;
            left: 0;

        }
    }
    </style>
</body>
    <div class="box1">
        <div class="test1"></div>
    </div>
</html>
