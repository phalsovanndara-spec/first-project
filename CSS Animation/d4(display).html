<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            display: block;
        }
        h1{
            display: inline;
        }
        .text1{
            width: 300px;
            height: 300px;
            background-color: blue;
            display: inline-block;
        }
        .text2{
            width: 300px;
            height: 300px;
            background-color: rgb(0, 255, 98);
            display: inline-block;
        }
        .text3{
            width: 300px;
            height: 300px;
            background-color: rgb(255, 251, 0);
            display: inline-block;
        }

        .parent{
            background-color: aqua;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            /* justify-content: center; */
        }
        .color1{
            width: 150px;
            height: 150px;
            background-color: blue;
        }
        .color2{
            width: 150px;
            height: 150px;
            background-color: rgb(0, 255, 38);
        }
        .parents{
            width: 50%;
            height:300px;
            background-color: blueviolet;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            overflow: auto;
            gap: 20px;
            /* padding: 20px; */
        }
        .box{
            width:150px;
            height: 150px;
        }
        .box1{
            background-color: blue;
        }
        .box2{
            background-color: rgb(0, 0, 8);
        }
        .box3{
            background-color: rgb(0, 115, 255);
        }
        .box4{
            background-color: blue;
        }
    </style>
</head>
<body>
    <span>This is span1</span>
    <span>This is span2</span>

    <h1>This is h1</h1>
    <h1>This is h1</h1><br><br>

    <div class="text1"></div>
    <div class="text2"></div>
    <div class="text3"></div>
    <br><br><br>

    <div class="parent">
        <div class="color1"></div>
        <div class="color2"></div>
    </div><br><br>

    <div class="parents">
        <div class="box1 box"></div>
        <div class="box2 box"></div>
        <div class="box3 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
        <div class="box4 box"></div>
    </div>
</body>
</html>
