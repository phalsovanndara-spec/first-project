<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p{
        color: white;
        font-size: 40px;
        
    }
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .title{
        width: 500px;
        height: 100px;
        margin: auto;
        margin-top: 100px;
        display: flex;
    }
    #title{
        color: black;
        justify-content: center;
        align-items: center;
        margin-left: 120px;
        margin-top: 25px;
    }
    .border{
        width: 710px;
        height: 505px;
        margin: auto;
        margin-top: 50px;
        border: 3px solid black;
    }
    .head{
        width: 100%;
        height: 100px;
        background-color: rgb(81, 30, 129);
        display: flex;
        justify-content: center;
        align-items: center;
        border:3px solid white;
    }
    .Navigate{
        width: 100%;
        height: 100px;
        background-color: rgb(78, 114, 23);
        display: flex;
        justify-content: center;
        align-items: center;
        border:3px solid white;
    }
    .Aside{
        width: 100%;
        height: 200px;
        display: flex;
    }
    .aside{
        width: 30%;
        height: 200px;
        background-color: green;
        justify-content: center;
        align-items: center;
        border:3px solid white;
        display: flex;
    }
    .div{
        width: 70%;  
        height: 200px;
    }
    .Content{
        width: 100%;
        height: 100px;
        background-color: brown;
        justify-content: center;
        align-items: center;
        border:3px solid white;
         display: flex;
    }
    .Section{
        width: 100%;
        height: 100px;
        background-color: rgb(31, 96, 96);
        justify-content: center;
        align-items: center;
        border:3px solid white;
        display: flex;
    }
    .Footer{
        width: 100%;
        height: 100px;
        background-color: blueviolet;
        justify-content: center;
        align-items: center;
        border:3px solid white;
        display: flex;
    }
</style>
<body>
    <div class="title">
        <p id="title">លទ្ធផលទទួលបាន</p>
    </div>
    <div class="border">
        <div class="head"> <p>Header</p></div>
         <div class="Navigate"> <p>Navigate</p></div>
        <div class="Aside">
            <div class="aside"><p>Aside</p></div>
            <div class="div">
                <div class="Content"><p>Content</p></div>
                <div class="Section"><p>Section</p></div>
            </div>
        </div>
        <div class="Footer"> <p>Footer</p></div>
    </div>
</body>
</html>
