<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .control{
            width: 100%;
            height: 10vh;
            background-color: rgb(1, 1, 184);
            position: relative;
            display: flex;
        }
        .header{
            width: 40%;
            height: 10vh;
            
        }
        .manu{
            width: 70%;
            height: 10vh;
            display: flex;
            align-items: center;
            gap: 45px;
            font-size: 18px
        }
        .text1{
            color: white;
            position: absolute;
            left: 30px;
            top: 30%;
        }
        .text2{
            display: flex;
            color: white;
            text-decoration: none;
        }
        .text2:hover{
            transform: scale(1.1);
            transition: all 0.3s ease-in-out;
        }
        .text3{
            color: white;
            text-decoration: none;
        }
        a{
            text-decoration: none;
            color: white;
        }
        .text4{
            width: 10%;
            height: 30px;
            background-color: aqua;
            position: relative;
            border-radius: 10px;
            
        }
        .text5{
            position: absolute;
            top: 3px;
            left: 13px;
            color: blue;
        }
    </style>
</head>
<body>
    <div class="control">
        <div class="header">
            <div class="text1"><h3>E-COMMERCE</h3></div>
        </div>
        <div class="manu">
            <div class="text2">
                
            </div>
            <a href="" class="text2">
                <div class="icon"><i class="fa-regular fa-house"></i></div>
                Home
            </a>
            <a href="" class="text3">
                <div class="icon1"><i class="fa-regular fa-address-card"></i>About us</div>
            </a>
            <a href="">skill</a>
            <a href="">Project</a>
            <a href="" class="text4">
               <p class="text5">Contact</p></a>

        </div>
    </div>
</body>
</html>
