<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .parent{
        width: 100px;
        height: 50px;
        display: grid;
        grid-template-columns: repeat(4,100px);
        grid-template-rows: 40px 40px 40px 40px 40px ;
        gap: 5px;
        margin: auto;
    }
    .parent div{
        background-color:rgb(55, 43, 226) ;
        color: white;
    }
    .child1{
        grid-row: span 2;
    }
    .child2{
        grid-column: span 2;
    }
    .child3{
        grid-row: span 2;
    }
    .child14{
        grid-column: span 4;
    }
    .child{
        text-align: center;
        
    }
</style>
<body>
    <div class="parent">
        <div class="child1 child">ថ្ងៃ</div>
        <div class="child2 child">ម៉ោងរៀន</div>
        <div class="child3 child">មុខវិជ្ជា</div>
        <div class="child4 child">ចាប់ផ្ដើម</div>
        <div class="child5 child">បញ្ចប់</div>
        <div class="child6">ចន្ទ</div>
        <div class="child7">8:00</div>
        <div class="child8">9:30</div>
        <div class="child9">Math</div>
        <div class="child10">អង្គារ</div>
        <div class="child11">9:45</div>
        <div class="child12">11:15</div>
        <div class="child13">English</div>
        <div class="child14">សរុបថ្ងៃរៀន: 2</div>
    </div>
</body>
</html>
