<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Unordered List Exercise</h1>

    <h3>Example 1: Fruits</h3>
    <ul style="list-style-type: disc;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Mango</li>
    </ul>
    <h3>Example 2: School Supplies</h3>
    <ul style="list-style-type: square;">
        <li>Pen</li>
        <li>Notebook</li>
        <li>Ruler</li>
        <li>Eraser</li>
    </ul>
    <h3>Example 3: Hobbies</h3>
    <ul style="list-style-type: circle;">
        <li>Reading</li>
        <li>Drawing</li>
        <li>Playing Football</li>
        <li>Listening Music</li>
    </ul>
</body>
</html>
