<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .card{
        width: 300px;
        height: 450px;
        box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
        margin: auto;
        margin-top: 20px;
        padding: 20px;
        border-radius: 10px;
    }
    .imgtest{
        width: 260px;
        height: 300px;
        background-color: aqua;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
    }
    .imgtest img{
        width: 100%;
        height: 100%;
    }
    .caption{
        width: 260px;
        height: 100%;
        margin-top: 10px;
        position: relative;
    }
    .caption button{
        width: 80%;
        height: 40px;
        border-style: none;
        background-color: blue;
        border-radius: 10px;
        color: white;
    }
    .caption button:hover{
        transform: scale(1.1);
        transition: all 0.3s ease-in-out;
    }
    .manu{
        width: 30px;
        height: 70px;
        background-color: blueviolet;
        position: absolute;
        right: 0;
        top: 10px;
    }
</style>
<body>
    <div class="card">
        <div class="imgtest">
            <img src="https://i.pinimg.com/736x/b6/ca/20/b6ca2086b63aed033fa638dea4ef2852.jpg" alt="">
        </div>
        <div class="caption">
            <h2>Camara Sony</h2>
            <div class="btn"><button>Add card</button></div>
            <div class="manu">

            </div>
        </div>
    </div>
</body>
</html>
